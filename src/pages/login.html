<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - RaiRock Music Store</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../css/styles.css">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>

  <!-- Cabecera -->
  <header class="text-center py-3 bg-dark text-white">
    <h1>Iniciar Sesión</h1>
  </header>

  <!-- Contenido principal -->
  <main class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <!-- Formulario de login -->
        <form id="form-login" class="p-4 border rounded bg-light shadow">
          <div class="mb-3">
            <label for="username" class="form-label">Nombre de usuario</label>
            <input type="text" class="form-control" id="username" placeholder="Tu nombre de usuario" required autofocus>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Contraseña</label>
            <div class="input-group">
              <input type="password" class="form-control" id="password" placeholder="********" required autocomplete="current-password" aria-describedby="loginPasswordHelp">
              <button class="btn btn-outline-secondary toggle-password" type="button" tabindex="0" aria-label="Mostrar contraseña">
                <i class="bi bi-eye"></i>
              </button>
            </div>
            <div id="loginPasswordHelp" class="form-text">Introduce tu contraseña de acceso.</div>
            <div id="loginPasswordError" class="text-danger visually-hidden" role="alert"></div>
          </div>
          <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" id="rememberMe">
            <label class="form-check-label" for="rememberMe">Recordar sesión</label>
          </div>
          <div class="d-grid">
            <button type="submit" class="btn btn-primary">Ingresar</button>
          </div>
          <div class="mt-3 text-center">
            <a href="registro.html">¿No tienes cuenta? Regístrate aquí</a>
          </div>
        </form>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="text-center mt-5 py-3 bg-dark text-white">
    <p>&copy; 2025 RaiRock Music Store</p>
  </footer>

  <!-- Modales de login y error importados dinámicamente -->
  <div id="modals-container"></div>
  <script>
    // Importa dinámicamente los modales desde partials/modals.html usando jQuery
    $(function() {
      $('#modals-container').load('../partials/modals.html');
    });
  </script>
  <script>
    // Añadir el año currentYear automáticamente
    if(document.getElementById('currentYear')){
      document.getElementById('currentYear').textContent = new Date().getFullYear();
    }
  </script>
  
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/login-ui.js"></script>
  <!-- Eliminada lógica duplicada de apertura automática del modal de login y scripts de accesibilidad, ahora centralizada en login-ui.js -->
</body>
</html>
