<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carrito Compacto</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    #contenedor-carrito {
      min-height: 166px !important;
      margin-bottom: 0;
      padding: 0 1rem;
    }

    .item-carrito {
      margin-bottom: 8px !important;
      padding: 1rem !important;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 1rem;
      max-width: 700px;
      width: 100%;
    }

    .item-carrito img {
      border-radius: 3px;
      box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.1);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .item-carrito img:hover {
      transform: scale(1.5);
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.15);
    }

    .item-carrito .cantidad {
      display: inline-block;
      width: 2.5ch;
      text-align: center;
    }

    /* --- MODO MÓVIL --- */
    @media (max-width: 576px) {
      .item-carrito {
        flex-direction: column;
        align-items: center;
        padding: 0.5rem !important;
        gap: 0 !important;
      }

      .item-carrito > div,
      .item-carrito .flex-grow-1 {
        width: 100% !important;
      }

      .item-carrito img {
        max-width: 35px;
        height: auto;
        display: block;
        margin: 0 auto 0.25rem auto;
      }

      .item-carrito .flex-grow-1.d-flex.justify-content-center {
        display: flex !important;
        flex-direction: column !important;
        align-items: center !important;
        justify-content: center !important;
        gap: 0 !important;
      }

      .item-carrito .d-flex.gap-4.align-items-center {
        flex-direction: column !important;
        align-items: center !important;
        gap: 0 !important;
        max-width: 100% !important;
      }

      .item-carrito .d-flex.flex-column.align-items-center {
        align-items: center !important;
        gap: 0 !important;
      }

      .item-carrito strong.text-center {
        font-size: 0.95rem;
        margin-bottom: 0.25rem;
      }

      .item-carrito .d-flex.align-items-center.gap-2 {
        gap: 0.2rem !important;
        margin-bottom: 0.25rem;
      }

      .item-carrito .cantidad {
        width: 2.5ch;
        text-align: center;
      }

      .item-carrito .btn {
        padding: 0.15rem 0.4rem;
        font-size: 0.75rem;
      }

      .item-carrito .item-precio {
        font-size: 0.8rem;
        text-align: center;
        margin-bottom: 0.25rem;
      }

      .item-carrito .item-precio .precio,
      .item-carrito .item-precio .subtotal-container {
        margin: 0;
        line-height: 1.2;
      }

      .item-carrito .btn-eliminar {
        align-self: center;
        margin-top: 0;
        font-size: 1rem;
        padding: 0.25rem 0.5rem;
      }
    }
  </style>
</head>
<body class="bg-light py-4">

  <ul id="contenedor-carrito" class="list-unstyled mx-auto">
    <li class="item-carrito list-group-item border rounded-3 shadow-sm p-3 mb-3 d-flex align-items-center mx-auto" data-id="1">
      <div style="width: 80px; flex-shrink: 0;">
        <img src="https://via.placeholder.com/80" alt="Producto de prueba" style="max-width: 100%; height: auto;">
      </div>
      <div class="flex-grow-1 d-flex justify-content-center">
        <div class="d-flex gap-4 align-items-center" style="max-width: 400px;">
          <div class="d-flex flex-column align-items-center gap-2" style="min-width: 150px;">
            <strong class="text-center">Producto de prueba</strong> 
            <div class="d-flex align-items-center gap-2">
              <button class="btn btn-outline-secondary btn-sm btn-restar">−</button>
              <span class="cantidad">2</span>
              <button class="btn btn-outline-secondary btn-sm btn-sumar">+</button>
            </div>
          </div>
          <div class="item-precio">
            <div class="precio">
              <span>Precio:</span> 9.99 €
            </div>
            <div class="subtotal-container">
              <strong>Subtotal:</strong> <span class="subtotal-amount">19.98 €</span>
            </div>
          </div>
        </div>
      </div>
      <button class="btn btn-sm btn-outline-danger btn-eliminar ms-auto" title="Eliminar" style="font-size: 1.25rem; line-height: 1;">
        <i class="bi bi-trash">🗑️</i>
      </button>
    </li>
  </ul>

</body>
</html>
