<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guitarras y Bajos - RaiRock Music Store</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <!-- HEADER DINÁMICO -->
  <div id="header-container"></div>

    <!-- Contenido principal -->
    <main class="container my-3" role="main" id="main-search">
        <div class="cabecera-resultados d-flex flex-column flex-sm-row justify-content-between align-items-center gap-2 p-3 border rounded bg-light mb-4">
            <h2 class="h5 m-0 text-secondary text-center text-sm-start">
                <i class="bi bi-search me-2"></i> Resultados
            </h2>
            <div class="d-flex align-items-center">
                <label for="selector-paginacion" class="form-label mb-0 me-2">Productos por página:</label>
                <select id="selector-paginacion" class="form-select form-select-sm w-auto">
                    <option value="6" selected>6</option>
                    <option value="12">12</option>
                    <option value="24">24</option>
                    <option value="0">Todos</option>
                </select>
            </div>
        </div>
        <div class="d-flex gap-4 busquedas">
        <!-- Filtros al lado izquierdo -->
            <aside id="filtros" class="filtros-lateral" aria-labelledby="titulo-filtros">
                <h3 class="d-flex align-items-center mb-4" id="titulo-filtros">
                    <img src="/assets/images/filter.svg" class="icono-nav" alt="imagen filtro">  Filtros
                </h3>
                <label for="orden-prioridad">Ordenar primero por:</label>
                <select id="orden-prioridad" name="orden-prioridad" class="form-select">
                    <option value="precio">Precio</option>
                    <option value="valoracion">Valoración</option>
                </select>
                <h4 class="mt-4">Precio</h4>
                <select id="orden-precio" name="orden-precio">
                    <option value="asc">Menor a mayor</option>
                    <option value="desc">Mayor a menor</option>
                </select>
                <h4 class="mt-4">Valoraciones</h4>
                <select id="orden-valoracion" name="orden-valoracion">
                    <option value="desc">De mayor a menor</option>
                    <option value="asc">De menor a mayor</option>
                </select>
                <h4>Filtrar por precio</h4>
                <label for="precio-min">Precio mínimo: <span id="min-valor">0</span> €</label>
                <input type="range" id="precio-min" name="precio-min" min="0" max="1000" value="0" step="10">
                <label for="precio-max">Precio máximo: <span id="max-valor">1000</span> €</label>
                <input type="range" id="precio-max" name="precio-max" min="0" max="1000" value="1000" step="10">
                <div id="filtro-oferta" class="form-check mt-2">
                    <input class="form-check-input" type="checkbox" id="checkbox-oferta">
                    <label class="form-check-label" for="checkbox-oferta">Solo en oferta</label>
                </div>
                <h4 class="mt-4">Filtrar por valoraciones</h4>
                <div id="filtro-estrellas" class="form-check mt-2">
                    <div class="festrellas">
                        <input class="form-check-input" type="checkbox" value="5" id="estrella-5" aria-label="5 estrellas">
                        <label class="form-check-label" for="estrella-5">⭐⭐⭐⭐⭐</label>
                    </div>
                    <div class="estrellas">
                        <input class="form-check-input" type="checkbox" value="4" id="estrella-4" aria-label="4 estrellas">
                        <label class="form-check-label" for="estrella-4">⭐⭐⭐⭐☆</label>
                    </div>
                    <div class="estrellas">
                        <input class="form-check-input" type="checkbox" value="3" id="estrella-3" aria-label="3 estrellas">
                        <label class="form-check-label" for="estrella-3">⭐⭐⭐☆☆</label>
                    </div>
                    <div class="estrellas">
                        <input class="form-check-input" type="checkbox" value="2" id="estrella-2" aria-label="2 estrellas">
                        <label class="form-check-label" for="estrella-2">⭐⭐☆☆☆</label>
                    </div>
                    <div class="estrellas">
                        <input class="form-check-input" type="checkbox" value="1" id="estrella-1" aria-label="1 estrellas">
                        <label class="form-check-label" for="estrella-2">⭐☆☆☆☆</label>
                    </div>
                </div>
            </aside>
            
            <!-- Resultados -->
            <div class="container">
                <section class="row row-cols-1 row-cols-md-3 g-4" id="resultados">
                <!-- tarjetas -->
                </section>
                <nav id="paginacion" class="mt-4 d-flex justify-content-center flex-wrap gap-2"></nav>
            </div>
        </div>
        <!-- Modal de notificación producto añadido -->
        <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 1050">
            <div id="toastAdd" class="toast align-items-center text-white bg-primary border-0" role="alert" aria-live="assertive" aria-atomic="true">
                <div class="d-flex">
                    <div class="toast-body">Instrumento añadido al carrito</div>
                    <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Cerrar"></button>
                </div>
            </div>
        </div>
    </main>

    <!-- PREFOOTER DINÁMICO -->
  <div id="prefooter-container"></div>

  <!-- FOOTER DINÁMICO -->
  <div id="footer-container"></div>

  <!-- MODALES LOGIN -->
  <div id="modals-container"></div>

    <!--Librerias-->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    
    <!-- CARGA DE HEADER, PREFOOTER, FOOTER, MODALES, SCRIPTS -->
    <script src="../js/loader.js"></script>

    <!-- SCRIPT LOCAL DE ESTA PÁGINA -->
    <script src="../js/product-detail.js"></script>
</body>
</html>
