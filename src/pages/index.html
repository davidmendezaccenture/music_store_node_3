    <!-- Modal de inicio de sesión -->

    <!--Script jQuery para cargar clientes. Con cada recarga se seleccionan 9 opiniones aleatorias que distribuimos en la estructura del carrusel. Después Lo añadimos al DOM-->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(document).ready(function () {
            $.getJSON("../assets/data/users.json", function (data) {
                const opinionesAleatorias = data.sort(() => 0.5 - Math.random()).slice(0, 9);
                const $contenedor = $('#carouselOpiniones .carousel-inner');
                for (let i = 0; i < 3; i++) {
                    const slide = $('<div>').addClass('carousel-item');
                    if (i === 0) slide.addClass('active');
                    const seccion = $('<section>').addClass('opiniones');
                    const container = $('<div>').addClass('container');
                    const fila = $('<div>').addClass('row');
                    for (let j = 0; j < 3; j++) {
                        const index = i * 3 + j;
                        const opinion = opinionesAleatorias[index];
                        const col = $('<div>').addClass('col-12 col-md-6 col-lg-4');
                        const tarjeta = $('<div>').addClass('tarjeta-opinion p-3 h-100');
                        const texto = $('<p>').addClass('texto').text(`"${opinion.opinion}"`);
                        const usuario = $('<div>').addClass('usuario d-flex align-items-center');
                        const img = $('<img>').attr('src', opinion.urlImagen)
                            .attr('alt', 'Foto de usuario')
                            .addClass('foto-usuario me-3');
                        const infoUsuario = $('<div>').addClass('info-usuario');
                        const nombre = $('<p>').addClass('nombre mb-0').text(opinion.nombre);
                        const profesion = $('<p>').addClass('profesion mb-1').text(opinion.profesion);
                        const estrellas = $('<div>').addClass('estrellas').text(opinion.estrellas);

                        infoUsuario.append(nombre, profesion, estrellas);
                        usuario.append(img, infoUsuario);
                        tarjeta.append(texto, usuario);
                        col.append(tarjeta);
                        fila.append(col);
                    }
                    container.append(fila);
                    seccion.append(container);
                    slide.append(seccion);
                    $contenedor.append(slide);
                }
            });
        });
</script>
