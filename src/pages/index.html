<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RaiRock Music Store</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/search.css">
    <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/@glidejs/glide/dist/css/glide.core.min.css">

</head>
<body>
   
    <!-- HEADER DINÁMICO -->
  <div id="header-container"></div>

    <!-- Resto del contenido se mantiene igual -->

        <!-- Barra de navegación secundaria -->
        <nav class="navbar bg-light py-2 mb-2 mt-4" role="navigation" aria-label="Menú de categorías de productos">
            <div class="container-fluid justify-content-center" id="navbarNav">
                <ul class="navbar-nav flex-row flex-wrap justify-content-center text-center">
                    <li class="nav-item p-0">
                        <a class="nav-link" href="/pages/guitar.html">
                            <img src="/assets/images/guitar-svgrepo-com.svg" alt="Icono guitarra" class="icono-nav">Guit/Bajos
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/pages/drums.html">
                            <img src="/assets/images/drum-set-svgrepo-com.svg" alt="Icono bateria" class="icono-nav">Baterías
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/pages/keyboard.html">
                            <img src="/assets/images/piano-svgrepo-com.svg" alt="Icono teclado" class="icono-nav">Teclados
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            <img src="/assets/images/mixing-pad-svgrepo-com.svg" alt="Icono mezclador" class="icono-nav">Estudio
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/pages/guitar.html">
                            <img src="/assets/images/laptop-player-svgrepo-com.svg" alt="Icono ordenador portátil" class="icono-nav">Software
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            <img src="/assets/images/speakers-speaker-svgrepo-com.svg" alt="Icono Sistema de sonido" class="icono-nav">Pa
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            <img src="/assets/images/lights-svgrepo-com.svg" alt="Icono foco de luz" class="icono-nav">Luces
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            <img src="/assets/images/dj-dj-svgrepo-com.svg" alt="Icono mano DJ" class="icono-nav">Dj
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            <img src="/assets/images/video-camera-svgrepo-com.svg" alt="Icono cámara de video" class="icono-nav">Video
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            <img src="/assets/images/microphone-part-2-svgrepo-com.svg" alt="Icono micrófono" class="icono-nav">Micros
                        </a>
                    </li>
                </ul>
            </div>
        </nav>
            <main class="container fade-slide-in" role="main">
  <div class="text-center">
    <h2 class="mb-3 d-inline-block"
        style="font-weight: 600; font-size: 1.75rem; color: #333; border-bottom: 1.5px solid #0d6efd; padding-bottom: 6px;">
      Productos destacados
    </h2>
  </div>

        <!-- Sección de productos -->
            <!-- Carrusel de imágenes -->
        <div id="carouselPrincipal" class="carousel slide" data-bs-ride="carousel" data-bs-interval="3000" aria-label="Galería de productos destacados">
            <!--Indicadores del carrusel-->
            <div class="carousel-indicators"></div>
            <!--La descripción de los productos destacados no puede ser precisa si en el futuro queremos que estos productos se seleccionen al azar-->
            <div class="carousel-inner"></div>
            <!-- Controles del carrusel -->
            <button class="carousel-control-prev" type="button" data-bs-target="#carouselPrincipal" data-bs-slide="prev" aria-label="Anterior">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#carouselPrincipal" data-bs-slide="next" aria-label="Siguiente">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
            </button>
        </div>

        <!-- Aquí se mostrarán los productos -->
        <!-- Creo contenedor vacío para mostrar productos-->
        <div id="products-list"></div>

        <!-- opinion clientes -->
        <!-- Creo un carrusel para opiniones de clientes. Están agrupadas de 3 en 3, y cada grupo de 3 está metido en una slide del carrusel-->
        <section class="py-5">
            <div class="container position-relative carruselGlide">
                <h2 class="text-center mb-5">Opiniones de nuestros clientes</h2>
                <!-- Glide wrapper -->
                <div class="glide">
                    <div class="glide__track" data-glide-el="track">
                        <ul class="glide__slides">
                        </ul>
                    </div>
                                    <!-- Flechas personalizadas -->
                <button class="glide__arrow--custom glide__arrow--left" aria-label="Anterior">
                    <i class="bi bi-chevron-left"></i>
                </button>
                <button class="glide__arrow--custom glide__arrow--right" aria-label="Siguiente">
                    <i class="bi bi-chevron-right"></i>
                </button>
                </div>

            </div>
        </section>
    </main>
   <!-- PREFOOTER -->
  <div id="prefooter-container"></div>

     <!-- FOOTER -->
  <div id="footer-container"></div> 

     <!-- MODALES LOGIN -->
  <div id="modals-container"></div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@glidejs/glide/dist/glide.min.js"></script>

   
<!-- Script de carga dinámica -->

<script src="../js/loader.js"></script>
<script src="../js/import-modals.js"></script>
<script src="../js/chatbot.js"></script>
<script src="../js/carrusel.js"></script>
<script src="../js/glide.js"></script>




</body>
</html>
