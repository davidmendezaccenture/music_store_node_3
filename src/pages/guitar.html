<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guitarras y Bajos - RaiRock Music Store</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/search.css">
</head>
<body>

<!-- Header dinámico -->
<div id="header-container"></div>

<main class="container mt-4" role="main">
  <!-- Filtro de categoría -->
  <div class="d-flex justify-content-center mb-4">
    <form class="row g-2 align-items-center" role="search" aria-label="Filtrar por categoría">
      <div class="col-auto">
        <label for="categoria" class="col-form-label">Filtrar por tipo:</label>
      </div>
      <div class="col-auto">
        <select id="categoria" class="form-select" aria-label="Seleccionar categoría">
          <option value="Todas" selected>Todas</option>
          <option value="Acústica">Acústicas</option>
          <option value="Clásica">Clásicas</option>
          <option value="Eléctrica">Eléctricas</option>
          <option value="Bajos">Bajos</option>
        </select>
      </div>
    </form>
  </div>

  <!-- Productos -->
  <div class="container">
    <section id="productosContainer" class="row row-cols-1 row-cols-sm-2 row-cols-md-4 g-3"></section>
  </div>

  <!-- Toast de producto añadido -->
  <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 1050">
    <div id="toastAdd" class="toast align-items-center text-white bg-primary border-0" role="alert" aria-live="assertive" aria-atomic="true">
      <div class="d-flex">
        <div class="toast-body">Instrumento añadido al carrito</div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Cerrar"></button>
      </div>
    </div>
  </div>
</main>

<!-- Prefooter y footer dinámicos -->
<div id="prefooter-container"></div>
<div id="footer-container"></div>

<!-- Modales -->
<div id="modals-container"></div>

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<!-- Script de carga dinámica -->

<script src="../js/loader.js"></script>
<script src="../js/import-modals.js"></script>


</body>
</html>
