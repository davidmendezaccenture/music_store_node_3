<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guitarras y Bajos - RaiRock Music Store</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <!-- Encabezado -->
    <header>
    <header class="bg-dark text-white py-3 mb-4" role="banner">
        <div class="container d-flex justify-content-between align-items-center">
            <h1 class="h3 mb-0" aria-label="Catálogo de Guitarras">Catálogo de Guitarras</h1>

        </div>
        <!-- Botón para regresar a la página principal -->
        <a href="index.html" class="btn btn-outline-light" aria-label="Volver a Home">Volver a Home</a>
        <!-- Logo y Título -->
        <!-- Contador del carrito -->
    </header>

    <!-- Contenido principal -->
    <main class="container mt-4" role="main">
        <!-- Encabezado -->
            <!-- Menú de Filtros -->
            <!-- Filtro por categoría centrado -->
            <div class="d-flex justify-content-center mb-4">
              <form class="row g-2 align-items-center" role="search" aria-label="Filtrar por categoría">
                  <div class="col-auto">
                      <label for="categoria" class="col-form-label">Filtrar por tipo:</label>
                  </div>
                  <div class="col-auto">
                      <select id="categoria" class="form-select" aria-label="Seleccionar categoría">
                          <option value="Todas" selected>Todas</option>
                      </select>
                  </div>
              </form>
            </div>
                <!-- Tarjetas existentes -->
                <section id="product-list" class="row row-cols-1 row-cols-md-3 g-4" aria-label="Listado de productos">

                </section>

    <!-- Pre-footer -->
                <!-- Columna 1: Comprar y pagar de forma segura -->
                <!-- Columna 2: Ventajas -->
                <!-- Columna 3: Redes sociales -->

    <!-- Footer -->
    <footer>

    </footer>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/cart.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/cart.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let productos = [];
            const selectCategoria = document.getElementById('categoria');
            const contenedor = document.getElementById('product-list');

            // Cargar productos y categorías
            fetch('../assets/data/products.json')
                .then(response => response.json())
                .then(data => {
                    productos = data;
                    cargarCategorias();
                    mostrarProductos('Todas');
                });

            // Generar opciones de categoría dinámicamente
            function cargarCategorias() {
                const categorias = [...new Set(productos.map(p => p.category))];
                categorias.forEach(cat => {
                    const option = document.createElement('option');
                    option.value = cat;
                    option.textContent = cat;
                    selectCategoria.appendChild(option);
                });
            }

            // Mostrar productos filtrados
            function mostrarProductos(categoria) {
                contenedor.innerHTML = '';
                const filtrados = categoria === 'Todas'
                    ? productos
                    : productos.filter(p => p.category === categoria);

                filtrados.forEach(producto => {
                    contenedor.innerHTML += `
                        <div class="col" data-category="${producto.category}">
                          <div class="card h-100" role="article">
                            <img src="${producto.image}" class="card-img-top" alt="${producto.name}">
                            <div class="card-body">
                              <h2 class="card-title h5">${producto.name}</h2>
                              <p class="card-text">${producto.description}</p>
                              <p class="card-text">
                                ${producto.offerPrice ? `
                                  <span class="text-muted text-decoration-line-through">${producto.price} €</span>
                                  <span class="fw-bold text-danger ms-2">${producto.offerPrice} €</span>
                                ` : `
                                  <span class="fw-bold">${producto.price} €</span>
                                `}
                              </p>
                              <button class="btn btn-primary" aria-label="Añadir ${producto.name} a la cesta">Añadir a la cesta</button>
                            </div>
                          </div>
                        </div>
                        `;
                });
            }

            // Evento de cambio en el filtro
            selectCategoria.addEventListener('change', (e) => {
                mostrarProductos(e.target.value);
            });
        });
    </script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            fetch('../assets/data/products.json')
                .then(response => response.json())
                .then(productos => {
                    const contenedor = document.getElementById('product-list');
                    contenedor.innerHTML = '';
                    productos.forEach(producto => {
                        contenedor.innerHTML += `
                        <div class="col" data-category="${producto.category}">
                        <div class="card h-100" role="article">
                            <img src="${producto.image}" class="card-img-top" alt="${producto.name}">
                            <div class="card-body">
                            <h2 class="card-title h5">${producto.name}</h2>
                            <p class="card-text">${producto.description}</p>
                            <p class="card-text">
                                <span class="text-muted text-decoration-line-through">${producto.price} €</span>
                                <span class="fw-bold text-danger ms-2">${producto.offerPrice} €</span>
                            </p>
                            <button class="btn btn-primary" aria-label="Añadir ${producto.name} a la cesta">Añadir a la cesta</button>
                            </div>
                        </div>
                        </div>
                        `;
                    });
                });
        });
        </script>

    <!-- Modal de Producto Añadido -->

</body>
</html>
