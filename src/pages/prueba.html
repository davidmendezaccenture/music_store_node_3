<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FUZZR</title>

    <!-- Bootstrap core & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Estilos propios -->
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

<!-- Carga dinámica del header -->
<div id="header-container"></div>

<main class="container my-5">
    <h2 class="text-center">Contenido de prueba</h2>
    <p class="lead text-center">Prueba.</p>
</main>

<!-- Carga condicional del prefooter -->
<div id="prefooter-container"></div>

<!-- Carga dinámica del footer -->
<div id="footer-container"></div>

<!-- Modal de login -->
<div class="modal fade" id="loginModal" tabindex="-1" aria-labelledby="loginLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title fs-5" id="loginLabel">Iniciar sesión</h2>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <div class="modal-body">
                <form id="loginForm">
                    <div class="mb-3">
                        <label for="loginEmail" class="form-label">Correo electrónico</label>
                        <input type="email" class="form-control" id="loginEmail" required placeholder="tucorreo@ejemplo.com">
                    </div>
                    <div class="mb-3">
                        <label for="loginPassword" class="form-label">Contraseña</label>
                        <input type="password" class="form-control" id="loginPassword" required placeholder="Contraseña">
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Entrar</button>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- jQuery (necesario para usar $('#element').load(...)) -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<script>
  $(function () {
    // Cargar header y footer siempre
    $('#header-container').load('../partials/header.html');
    $('#footer-container').load('../partials/footer.html');

    // Cargar pre-footer solo si la página lo requiere
    const paginasConPrefooter = [
      'index.html', 'guitar.html', 'keyboard.html', 'drums.html',
      'product-detail.html', 'services.html'
    ];
    const paginaActual = window.location.pathname.split('/').pop();

    if (paginasConPrefooter.includes(paginaActual)) {
      $('#prefooter-container').load('../partials/prefooter.html');
    }
  });
</script>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
