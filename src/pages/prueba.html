<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FUZZR</title>

    <!-- Bootstrap core & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Estilos propios -->
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

<!-- Encabezado -->
<header class="sticky-top bg-light shadow-sm">
    <!-- 1ª línea - logo centrado -->
    <div class="border-bottom py-2 bg-light">
        <div class="text-center">
            <a class="navbar-brand d-inline-flex align-items-center" href="/pages/index.html">
                <img src="../assets/images/Rairock.png" alt="RaiRock Logo" height="50" class="me-2">
                <span class="fw-bold fs-3">RaiRock</span>
            </a>
        </div>
    </div>

    <!-- 2ª línea - navegación y acciones -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light py-3 px-3">
        <div class="container-fluid p-0">
            <!-- Versión mobile -->
            <div class="d-lg-none w-100">
                <div class="mobile-top-bar">
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="user-actions-mobile">
                        <a href="/pages/favorites.html" class="btn btn-outline-dark position-relative">
                            <i class="bi bi-heart"></i>
                            <span id="favoritesCounterMobile" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"></span>
                        </a>
                        <a href="/pages/cart.html" class="btn btn-outline-dark position-relative">
                            <i class="bi bi-cart3"></i>
                            <span id="cartCounterMobile" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"></span>
                        </a>
<div id="user-auth-mobile" class="d-flex align-items-center">
  <span id="username-mobile" class="fw-bold user-name mx-3 text-truncate">Invitado</span>
  <div id="auth-button-mobile"></div>
</div>
                    </div>
                </div>
                <div class="search-bar-mobile">
                    <form id="form-busqueda-mobile" class="d-flex me-3 mb-3 mb-lg-0 form-busqueda" action="/pages/search.html" method="GET" role="search">
                        <div class="input-group">
                            <input type="text" class="form-control flex-grow-1 ms-2" name="q" placeholder="Buscar">
                            <select class="form-select" name="category" style="max-width: 120px;">
                                <option value="">Todas</option>
                                <option value="acoustic-guitars">Guitarras acústica</option>
                                <option value="classical-guitars">Guitarras clásicas</option>
                                <option value="electric-guitars">Guitarras eléctrica</option>
                                <option value="basses">Bajos</option>
                                <option value="amplifiers">Amplificadores</option>
                                <option value="effect-pedals">Pedales</option>
                                <option value="drums">Baterías</option>
                            </select>
                            <button class="btn btn-outline-primary" type="submit">
                                <i class="bi bi-search"></i>
                            </button>
                        </div>
                    </form>
                </div>
                <div class="collapse navbar-collapse" id="mainNav">
                    <ul class="navbar-nav">
                        <li class="nav-item"><a class="nav-link" href="/pages/index.html"><i class="bi bi-house-door me-1"></i>Inicio</a></li>
                        <li class="nav-item"><a class="nav-link" href="/pages/services.html"><i class="bi bi-gear me-1"></i>Servicios</a></li>
                        <li class="nav-item"><a class="nav-link" href="/pages/sobre_nosotros.html"><i class="bi bi-people me-1"></i>Sobre nosotros</a></li>
                        <li class="nav-item"><a class="nav-link" href="/pages/contact.html"><i class="bi bi-envelope me-1"></i>Contacto</a></li>
                    </ul>
                </div>
            </div>

            <!-- Versión desktop -->
            <div class="d-none d-lg-flex desktop-nav-container">
                <div class="nav-links-desktop">
                    <ul class="navbar-nav d-flex flex-row">
                        <li class="nav-item me-3"><a class="nav-link" href="/pages/index.html"><i class="bi bi-house-door me-1"></i>Inicio</a></li>
                        <li class="nav-item me-3"><a class="nav-link" href="/pages/services.html"><i class="bi bi-gear me-1"></i>Servicios</a></li>
                        <li class="nav-item me-3"><a class="nav-link" href="/pages/sobre_nosotros.html"><i class="bi bi-people me-1"></i>Sobre nosotros</a></li>
                        <li class="nav-item"><a class="nav-link" href="/pages/contact.html"><i class="bi bi-envelope me-1"></i>Contacto</a></li>
                    </ul>
                </div>
                <div class="search-bar-desktop">
                    <form id="form-busqueda-desktop" class="d-flex me-3 mb-3 mb-lg-0 form-busqueda" action="/pages/search.html" method="GET" role="search">
                        <div class="input-group">
                            <input type="text" class="form-control flex-grow-1 ms-2" name="q" placeholder="Buscar">
                            <select class="form-select" name="category" style="max-width: 120px;">
                                <option value="">Todas</option>
                                <option value="acoustic-guitars">Guitarras acústica</option>
                                <option value="classical-guitars">Guitarras clásicas</option>
                                <option value="electric-guitars">Guitarras eléctrica</option>
                                <option value="basses">Bajos</option>
                                <option value="amplifiers">Amplificadores</option>
                                <option value="effect-pedals">Pedales</option>
                                <option value="drums">Baterías</option>
                            </select>
                            <button class="btn btn-outline-primary" type="submit">
                                <i class="bi bi-search"></i>
                            </button>
                        </div>
                    </form>

                </div>
                <div class="user-actions-desktop d-flex gap-2">
                    <a href="/pages/favorites.html" class="btn btn-outline-dark position-relative">
                        <i class="bi bi-heart icono-contador"></i>
                        <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"></span>
                    </a>
                    <a href="/pages/cart.html" class="btn btn-outline-dark position-relative">
                        <i class="bi bi-cart3 icono-contador"></i>
                        <span id="cartCounterDesktop" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"></span>
                    </a>
<div id="user-auth-desktop" class="d-flex align-items-center">
  <span id="username-desktop" class="fw-bold user-name mx-3 text-truncate">Invitado</span>
  <div id="auth-button-desktop"></div>
</div>
                </div>
            </div>
        </div>
    </nav>
</header>

<main class="container my-5">
    <h2 class="text-center">Contenido de prueba</h2>
    <p class="lead text-center">Prueba.</p>
</main>

<!-- Modal de login -->
<div class="modal fade" id="loginModal" tabindex="-1" aria-labelledby="loginLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title fs-5" id="loginLabel">Iniciar sesión</h2>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <div class="modal-body">
                <form id="loginForm">
                    <div class="mb-3">
                        <label for="loginEmail" class="form-label">Correo electrónico</label>
                        <input type="email" class="form-control" id="loginEmail" required placeholder="tucorreo@ejemplo.com">
                    </div>
                    <div class="mb-3">
                        <label for="loginPassword" class="form-label">Contraseña</label>
                        <input type="password" class="form-control" id="loginPassword" required placeholder="Contraseña">
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Entrar</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
