<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Factura del Pedido</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; max-width: 800px; margin: auto; }
    h1 { border-bottom: 2px solid #000; padding-bottom: 10px; }
    .info, .productos, .totales, .estado { margin-top: 20px; }
    .productos div { margin-bottom: 10px; }
    .resaltado { font-weight: bold; }
    .pendiente { color: #b35c00; }
    .pagado { color: green; }
    .aviso { background-color: #fff8e1; padding: 10px; border-left: 5px solid #ffc107; margin-top: 20px; }
    .botones { margin-top: 30px; }
    button { padding: 10px 20px; margin-right: 10px; }
  </style>
</head>
<body>
  <h1>Resumen del Pedido</h1>

  <div class="info">
    <p><span class="resaltado">Pedido:</span> <span id="pedido-id"></span></p>
    <p><span class="resaltado">Fecha:</span> <span id="pedido-fecha"></span></p>
    <p><span class="resaltado">Nombre:</span> <span id="cliente-nombre"></span></p>
    <p><span class="resaltado">Email:</span> <span id="cliente-email"></span></p>
    <p><span class="resaltado">Teléfono:</span> <span id="cliente-telefono"></span></p>
    <p><span class="resaltado">Envío:</span> <span id="metodo-envio"></span></p>
    <p><span class="resaltado">Pago:</span> <span id="metodo-pago"></span></p>
    <p id="direccion-envio" style="display:none;"><span class="resaltado">Dirección:</span> <span id="direccion-completa"></span></p>
  </div>

  <div class="estado">
    <p class="resaltado">Estado del pedido: <span id="estado-texto"></span></p>
    <p id="localizador-linea" style="display: none;"><span class="resaltado">Localizador:</span> <span id="localizador"></span></p>
    <div id="mensaje-pendiente" class="aviso" style="display: none;">
      Este pedido está pendiente de confirmación de pago. Recibirás un correo cuando se confirme.
    </div>
  </div>

  <div class="productos">
    <h2>Productos</h2>
    <div id="lista-productos"></div>
  </div>

  <div class="totales">
    <p><span class="resaltado">Subtotal:</span> <span id="subtotal"></span> €</p>
    <p><span class="resaltado">Descuento:</span> <span id="descuento"></span> €</p>
    <p><span class="resaltado">Gastos de envío:</span> <span id="envio"></span> €</p>
    <p class="resaltado" style="font-size: 1.2em;">Total: <span id="total"></span> €</p>
  </div>

  <div class="botones">
    <button onclick="window.print()">Imprimir</button>
    <button onclick="window.location.href='index.html'">Volver a la tienda</button>
  </div>

  <script src="../js/factura.js"></script>
</body>
</html>
