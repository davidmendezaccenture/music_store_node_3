<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Usuario - RaiRock Music Store</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../css/styles.css">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>

  <!-- Cabecera -->
  <header class="bg-white shadow-sm sticky-top">
    <nav class="navbar navbar-expand-lg navbar-light">
        <div class="container">
          <!-- Logo + Nombre -->
          <a class="navbar-brand d-flex align-items-center" href="index.html">
            <img src="../assets/images/Rairock.png" alt="RaiRock Logo" height="30" class="me-2" onerror="this.onerror=null;this.src='../assets/images/rairock_black.png';">
            <span class="fw-bold">RaiRock</span>
          </a>
          <!-- Menú Hamburguesa (mobile) -->
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain">
            <span class="navbar-toggler-icon"></span>
          </button>
          <!-- Menú Principal -->
          <div class="collapse navbar-collapse" id="navbarMain">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
              <li class="nav-item">
                <a class="nav-link" href="index.html">
                  <i class="bi bi-house-door me-1"></i> Inicio
                </a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#services">
                  <i class="bi bi-gear me-1"></i> Servicios
                </a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#about">
                  <i class="bi bi-people me-1"></i> Sobre Nosotros
                </a>
              </li>
            </ul>
          </div>
        </div>
    </nav>
  </header>

  <!-- Contenido principal -->
  <main class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-10 col-lg-8 col-xl-7"> <!-- Más ancho en pantallas grandes -->
        <!-- Formulario de registro -->
        <form id="form-registro" class="p-4 border rounded bg-light shadow mb-5">
          <h2 class="mb-4 text-center">Crear cuenta</h2>
          <div class="row g-3">
            <div class="col-md-6">
              <label for="username" class="form-label">Nombre de usuario</label>
              <input type="text" class="form-control" id="username" name="username" placeholder="Tu nombre de usuario" required autocomplete="username" autofocus tabindex="1">
            </div>
            <div class="col-md-6">
              <label for="email" class="form-label">Correo electrónico</label>
              <input type="email" class="form-control" id="email" name="email" placeholder="usuario@correo.com" required autocomplete="email" tabindex="2">
            </div>
            <div class="col-md-6">
              <label for="birthdate" class="form-label">Fecha de nacimiento</label>
              <input type="date" class="form-control" id="birthdate" name="birthdate" required aria-required="true" tabindex="3">
            </div>
            <div class="col-md-6">
              <label for="phone" class="form-label">Teléfono</label>
              <input type="tel" class="form-control" id="phone" name="phone" placeholder="Ej: 600123456" required pattern="[0-9]{9}" aria-required="true" autocomplete="tel" tabindex="4">
            </div>
            <div class="col-md-6">
              <label for="postalcode" class="form-label">Código Postal</label>
              <input type="text" class="form-control" id="postalcode" name="postalcode" placeholder="Ej: 28001" required pattern="[0-9]{5}" aria-required="true" autocomplete="postal-code" tabindex="5">
            </div>
            <div class="col-md-6">
              <label for="city" class="form-label">Ciudad</label>
              <input type="text" class="form-control" id="city" name="city" placeholder="Ej: Madrid" required autocomplete="address-level2" aria-required="true" tabindex="6">
            </div>
            <div class="col-md-6">
              <label for="password" class="form-label">Contraseña</label>
              <div class="input-group">
                <input type="password" class="form-control" id="password" name="password" placeholder="********" required autocomplete="new-password" aria-describedby="passwordHelp" tabindex="7">
                <button class="btn btn-outline-secondary toggle-password" type="button" tabindex="8" aria-label="Mostrar contraseña">
                  <i class="bi bi-eye"></i>
                </button>
              </div>
              <div id="passwordHelp" class="form-text">La contraseña debe tener al menos 8 caracteres, una mayúscula, una minúscula y un número.</div>
              <div id="passwordError" class="text-danger visually-hidden" role="alert"></div>
            </div>
            <div class="col-md-6">
              <label for="confirmPassword" class="form-label">Confirmar contraseña</label>
              <div class="input-group">
                <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" placeholder="********" required autocomplete="new-password" tabindex="9">
                <button class="btn btn-outline-secondary toggle-password" type="button" tabindex="10" aria-label="Mostrar contraseña">
                  <i class="bi bi-eye"></i>
                </button>
              </div>
              <div id="confirmPasswordError" class="text-danger visually-hidden" role="alert"></div>
            </div>
            <div class="col-12 d-grid">
              <button type="submit" class="btn btn-primary" tabindex="11">Registrarse</button>
            </div>
            <div class="col-12 mt-3 text-center">
              <a href="index.html?showLogin=1" tabindex="12">¿Ya tienes cuenta? Inicia sesión</a>
            </div>
          </div>
        </form>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-dark text-white py-3">
        <div class="container text-center">
            <p class="mb-0">&copy; <span id="currentYear"></span> RaiRock Music Store. Todos los derechos reservados.</p>
        </div>
    </footer>
<script>
  // Actualiza el año automáticamente en el footer
  document.getElementById('currentYear').textContent = new Date().getFullYear();
</script>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    // Mostrar/ocultar contraseña (funciona para todos los campos con .toggle-password)
    document.querySelectorAll('.toggle-password').forEach(function(btn) {
      btn.addEventListener('click', function() {
        const input = this.parentElement.querySelector('input');
        if (input.type === 'password') {
          input.type = 'text';
          this.querySelector('i').classList.remove('bi-eye');
          this.querySelector('i').classList.add('bi-eye-slash');
          this.setAttribute('aria-label', 'Ocultar contraseña');
        } else {
          input.type = 'password';
          this.querySelector('i').classList.remove('bi-eye-slash');
          this.querySelector('i').classList.add('bi-eye');
          this.setAttribute('aria-label', 'Mostrar contraseña');
        }
      });
    });
    // Ejemplo de mostrar error accesible (puedes usar esto en tu JS de validación)
    function mostrarErrorPassword(msg) {
      const errorDiv = document.getElementById('passwordError');
      errorDiv.textContent = msg;
      errorDiv.classList.remove('visually-hidden');
    }
    function ocultarErrorPassword() {
      const errorDiv = document.getElementById('passwordError');
      errorDiv.textContent = '';
      errorDiv.classList.add('visually-hidden');
    }
    function mostrarErrorConfirm(msg) {
      const errorDiv = document.getElementById('confirmPasswordError');
      errorDiv.textContent = msg;
      errorDiv.classList.remove('visually-hidden');
    }
    function ocultarErrorConfirm() {
      const errorDiv = document.getElementById('confirmPasswordError');
      errorDiv.textContent = '';
      errorDiv.classList.add('visually-hidden');
    }
  </script>
</body>
</html>
