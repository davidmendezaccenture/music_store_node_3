<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Usuario - RaiRock Music Store</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../css/styles.css">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>

  <header class="bg-white shadow-sm sticky-top">
    <nav class="navbar navbar-expand-lg navbar-light">
      <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="index.html" aria-label="Volver a la página principal">
          <i class="bi bi-arrow-left-circle me-2 fs-4" role="img" aria-hidden="true"></i>
          Volver
        </a>

        <a class="navbar-brand d-flex align-items-center" href="index.html" tabindex="-1">
          <img src="../assets/images/Rairock.png" alt="RaiRock Logo" height="30" class="me-2" />
          <span class="fw-bold">RaiRock</span>
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain"
          aria-controls="navbarMain" aria-expanded="false" aria-label="Alternar menú principal">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarMain">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item"><a class="nav-link" href="index.html"><i class="bi bi-house-door me-1"></i> Inicio</a></li>
            <li class="nav-item"><a class="nav-link" href="#services"><i class="bi bi-gear me-1"></i> Servicios</a></li>
            <li class="nav-item"><a class="nav-link active" aria-current="page" href="sobre_nosotros.html"><i class="bi bi-people me-1"></i> Sobre Nosotros</a></li>
            <li class="nav-item"><a class="nav-link" href="#contact"><i class="bi bi-envelope me-1"></i> Contacto</a></li>
          </ul>

          <div class="d-flex">
            <a href="cart.html" class="btn btn-outline-dark position-relative me-2">
              <i class="bi bi-cart3"></i>
              <span id="cartCounter" class="position-absolute top-0 start-100 translate-middle badge bg-danger rounded-pill">0</span>
            </a>
            <button class="btn btn-dark" data-bs-toggle="modal" data-bs-target="#loginModal">
              <i class="bi bi-person-fill me-1"></i> Login
            </button>
          </div>
        </div>
      </div>
    </nav>
  </header>

  <!-- Contenido principal -->
  <main class="container mt-5">
    <h1 class="text-center mb-4">Registro de Usuario</h1>
    <div class="row justify-content-center">
      <div class="col-md-6">
        <!-- Formulario de registro -->
        <form id="form-registro" class="p-4 border rounded bg-light shadow">
          <div class="mb-3">
            <label for="regUsername" class="form-label">Nombre de usuario</label>
            <input type="text" class="form-control" id="regUsername" placeholder="Tu nombre de usuario" required>
          </div>
          <div class="mb-3">
            <label for="regEmail" class="form-label">Correo electrónico</label>
            <input type="email" class="form-control" id="regEmail" placeholder="usuario@correo.com" required>
          </div>
          <div class="mb-3">
            <label for="regPassword" class="form-label">Contraseña</label>
            <input type="password" class="form-control" id="regPassword" placeholder="********" required>
          </div>
          <div class="mb-3">
            <label for="regConfirmPassword" class="form-label">Confirmar contraseña</label>
            <input type="password" class="form-control" id="regConfirmPassword" placeholder="********" required>
          </div>
          <div class="d-grid">
            <button type="submit" class="btn btn-success">Registrarse</button>
          </div>
          <div class="mt-3 text-center">
            <a href="#" class="text-primary" data-bs-toggle="modal" data-bs-target="#loginModal">¿Ya tienes cuenta? Inicia sesión</a>
          </div>
        </form>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="text-center mt-5 py-3 bg-dark text-white">
    <p>&copy; 2025 RaiRock Music Store</p>
  </footer>
  
  <!-- Modal de inicio de sesión -->
  <div class="modal fade" id="loginModal" tabindex="-1" aria-labelledby="loginModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title fs-5" id="loginModalLabel">Iniciar sesión</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <form id="loginForm">
            <div class="mb-3">
              <label for="loginEmail" class="form-label">Correo electrónico</label>
              <input type="email" class="form-control" id="loginEmail" required placeholder="tucorreo@ejemplo.com" />
            </div>
            <div class="mb-3">
              <label for="loginPassword" class="form-label">Contraseña</label>
              <input type="password" class="form-control" id="loginPassword" required placeholder="Introduce tu contraseña" />
            </div>
            <div class="mb-3 form-check">
              <input type="checkbox" class="form-check-input" id="rememberMe" />
              <label class="form-check-label" for="rememberMe">Recordar sesión</label>
            </div>
            <button type="submit" class="btn btn-primary w-100">Iniciar sesión</button>
          </form>
        </div>
        <div class="modal-footer justify-content-center">
          <p class="mb-0">¿No tienes cuenta? <a href="#" id="enlace-registro">Regístrate aquí</a></p>
        </div>
      </div>
    </div>
  </div>



  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/auth.js"></script>

  <!-- Añdo una animacion para dar tiempo a redirigir a la pagina de registro antes de cerrar el modal de login-->
  <script>
    $('#enlace-registro').on('click', function (e) {
      e.preventDefault();

    // Añade una clase de animación de salida al modal
      $('#loginModal .modal-content').addClass('animate__animated animate__fadeOutUp');

    // Espera la animación (500 ms aprox), luego cierra el modal y redirige
      setTimeout(() => {
        const modal = bootstrap.Modal.getInstance(document.getElementById('loginModal'));
        modal.hide(); // Cierra el modal programáticamente
        window.location.href = 'registro.html'; // Redirige a la página de registro
      }, 600); // Delay algo mayor a la duración de la animación
    });
  </script>

</body>
</html>
