<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Usuario - RaiRock Music Store</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../css/styles.css">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>

  <!-- Cabecera -->
  <header class="bg-white shadow-sm sticky-top">
    <nav class="navbar navbar-expand-lg navbar-light">
        <div class="container">
          <!-- Logo + Nombre -->
          <a class="navbar-brand d-flex align-items-center" href="index.html">
            <img src="../assets/images/Rairock.png" alt="RaiRock Logo" height="30" class="me-2" onerror="this.onerror=null;this.src='../assets/images/rairock_black.png';">
            <span class="fw-bold">RaiRock</span>
          </a>
          <!-- Menú Hamburguesa (mobile) -->
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain">
            <span class="navbar-toggler-icon"></span>
          </button>
          <!-- Menú Principal -->
          <div class="collapse navbar-collapse" id="navbarMain">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
              <li class="nav-item">
                <a class="nav-link" href="index.html">
                  <i class="bi bi-house-door me-1"></i> Inicio
                </a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#services">
                  <i class="bi bi-gear me-1"></i> Servicios
                </a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#about">
                  <i class="bi bi-people me-1"></i> Sobre Nosotros
                </a>
              </li>
            </ul>
            <ul class="navbar-nav mb-2 mb-lg-0">
              <li class="nav-item">
                <a class="nav-link" href="../pages/registro.html">
                  <i class="bi bi-person-plus me-1"></i> Registrarse
                </a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#" data-bs-toggle="modal" data-bs-target="#loginModal">
                  <i class="bi bi-box-arrow-in-right me-1"></i> Iniciar sesión
                </a>
              </li>
            </ul>
          </div>
        </div>
    </nav>
  </header>

  <!-- Contenido principal -->
  <main class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <!-- Formulario de registro -->
        <form id="form-registro" class="p-4 border rounded bg-light shadow">
          <div class="mb-3">
            <label for="username" class="form-label">Nombre de usuario</label>
            <input type="text" class="form-control" id="username" placeholder="Tu nombre de usuario" required autocomplete="username" autofocus>
          </div>
          <div class="mb-3">
            <label for="email" class="form-label">Correo electrónico</label>
            <input type="email" class="form-control" id="email" placeholder="usuario@correo.com" required autocomplete="email">
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Contraseña</label>
            <div class="input-group">
              <input type="password" class="form-control" id="password" placeholder="********" required autocomplete="new-password" aria-describedby="passwordHelp">
              <button class="btn btn-outline-secondary toggle-password" type="button" tabindex="0" aria-label="Mostrar contraseña">
                <i class="bi bi-eye"></i>
              </button>
            </div>
            <div id="passwordHelp" class="form-text">La contraseña debe tener al menos 8 caracteres, una mayúscula, una minúscula y un número.</div>
            <div id="passwordError" class="text-danger visually-hidden" role="alert"></div>
          </div>
          <div class="mb-3">
            <label for="confirmPassword" class="form-label">Confirmar contraseña</label>
            <div class="input-group">
              <input type="password" class="form-control" id="confirmPassword" placeholder="********" required autocomplete="new-password">
              <button class="btn btn-outline-secondary toggle-password" type="button" tabindex="0" aria-label="Mostrar contraseña">
                <i class="bi bi-eye"></i>
              </button>
            </div>
            <div id="confirmPasswordError" class="text-danger visually-hidden" role="alert"></div>
          </div>
          <div class="d-grid">
            <button type="submit" class="btn btn-primary">Registrarse</button>
          </div>
          <div class="mt-3 text-center">
            <a href="index.html?showLogin=1">¿Ya tienes cuenta? Inicia sesión</a>
          </div>
        </form>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-dark text-white py-3">
        <div class="container text-center">
            <p class="mb-0">&copy; <span id="currentYear"></span> RaiRock Music Store. Todos los derechos reservados.</p>
        </div>
    </footer>
<script>
  // Actualiza el año automáticamente en el footer
  document.getElementById('currentYear').textContent = new Date().getFullYear();
</script>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    // Mostrar/ocultar contraseña (funciona para todos los campos con .toggle-password)
    document.querySelectorAll('.toggle-password').forEach(function(btn) {
      btn.addEventListener('click', function() {
        const input = this.parentElement.querySelector('input');
        if (input.type === 'password') {
          input.type = 'text';
          this.querySelector('i').classList.remove('bi-eye');
          this.querySelector('i').classList.add('bi-eye-slash');
          this.setAttribute('aria-label', 'Ocultar contraseña');
        } else {
          input.type = 'password';
          this.querySelector('i').classList.remove('bi-eye-slash');
          this.querySelector('i').classList.add('bi-eye');
          this.setAttribute('aria-label', 'Mostrar contraseña');
        }
      });
    });
    // Ejemplo de mostrar error accesible (puedes usar esto en tu JS de validación)
    function mostrarErrorPassword(msg) {
      const errorDiv = document.getElementById('passwordError');
      errorDiv.textContent = msg;
      errorDiv.classList.remove('visually-hidden');
    }
    function ocultarErrorPassword() {
      const errorDiv = document.getElementById('passwordError');
      errorDiv.textContent = '';
      errorDiv.classList.add('visually-hidden');
    }
    function mostrarErrorConfirm(msg) {
      const errorDiv = document.getElementById('confirmPasswordError');
      errorDiv.textContent = msg;
      errorDiv.classList.remove('visually-hidden');
    }
    function ocultarErrorConfirm() {
      const errorDiv = document.getElementById('confirmPasswordError');
      errorDiv.textContent = '';
      errorDiv.classList.add('visually-hidden');
    }
  </script>
</body>
</html>
