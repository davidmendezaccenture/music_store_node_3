<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Carrito de Compras</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <header class="bg-white shadow-sm sticky-top">
        <nav class="navbar navbar-expand-lg navbar-light">
            <div class="container">
                <!-- Logo + Nombre -->
                <a class="navbar-brand d-flex align-items-center" href="/pages/index.html">
                    <img src="../assets/images/Rairock.png" alt="RaiRock Logo" height="30" class="me-2">
                    <span class="fw-bold">RaiRock</span>
                </a>
                <a href="/pages/index.html">Volver a inicio</a>
                <a id="seguir-comprando" href="#" class="btn btn-primary">Seguir comprando</a>
            </div>
        </nav>
    </header>
    <main>
        <div class="container mt-5">
            <h2 class="mb-4">Tu Carrito</h2>
            <ul class="container-fluid px-3" id="contenedor-carrito">
            </ul>
            <div class="container-fluid px-3 mt-3" id="total">
                <h4 class="text-end">Total: <span id="total-carrito"></span> €</h4>
                <div class="text-end">
                    <button id="vaciar-carrito" class="btn btn-danger mb-2">Vaciar Carrito</button>
                </div>
            </div>
        </div>
    </main>
    <!-- Footer -->
    <footer class="bg-dark text-white py-3 pie-de-pagina">
        <div class="container text-center ">
            <p class="mb-0">&copy; <span id="currentYear"></span> RaiRock Music Store. Todos los derechos reservados.</p>
        </div>
    </footer>

    <!-- Modal de inicio de sesión -->
<div class="modal fade" id="loginModal" tabindex="-1" aria-labelledby="loginModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title fs-5" id="loginModalLabel">Iniciar sesión</h2>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <div class="modal-body">
                <form id="loginForm">
                    <div class="mb-3">
                        <label for="loginEmail" class="form-label">Correo electrónico</label>
                        <input type="email" class="form-control" id="loginEmail" required
                            aria-describedby="emailHelp" placeholder="tucorreo@ejemplo.com">
                    </div>
                    <div class="mb-3">
                        <label for="loginPassword" class="form-label">Contraseña</label>
                        <input type="password" class="form-control" id="loginPassword" required
                            placeholder="Introduce tu contraseña">
                    </div>
                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="rememberMe">
                        <label class="form-check-label" for="rememberMe">Recordar sesión</label>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Iniciar sesión</button>
                </form>
            </div>
            <div class="modal-footer justify-content-center">
                <p class="mb-0">¿No tienes cuenta? <a href="#" data-bs-toggle="modal" data-bs-target="#registerModal"
                data-bs-dismiss="modal">Regístrate aquí</a></p>
            </div>
        </div>
    </div>
</div>

<script>
    // Añadir el año actual automáticamente
    document.getElementById('currentYear').textContent = new Date().getFullYear();
</script>
  <script>
    //script para volver a la página guardada anterior. Si no hay, devuelve a home
    document.addEventListener('DOMContentLoaded', () => {
      const regreso = localStorage.getItem('ultimaPagina') || '/pages/index.html';
      document.getElementById('seguir-comprando').href = regreso;
    });
  </script>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="../js/cart.js"></script>
</body>
</html>
