<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guitarras y Bajos - RaiRock Music Store</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/stylesSearch.css">
    <link rel="stylesheet" href="../css/search.css">
</head>
<body>
    <!-- Header dinámico -->
    <div id="header-container"></div>

    <main class="container mt-4 fade-slide-in" role="main">

    <div class="mb-3 text-center">
      <h2 style="margin-bottom: 4px;">Tu Carrito</h2>
      <div class="text-start">
        <a id="seguir-comprando" href="#" class="btn btn-primary fw-bold">
        <i class="bi bi-arrow-left-circle me-2" aria-hidden="true"></i> Seguir comprando
        </a>
      </div>
    </div>
    <ul class="container-fluid px-3" id="contenedor-carrito"></ul>
    <div class="container-fluid px-3" id="total">
        <h4 class="text-end">Total: <span id="total-carrito"></span> €</h4>
        <div class="botones-carrito text-end mt-2">
          <button id="hacer-checkout" class="hacer-checkout" aria-label="Confirmar y proceder al pago"><i class="bi bi-cart3 icono-contador"></i>Ir a pago</button>
        </div>
      </div>
    </main>

 <!-- Prefooter y footer dinámicos -->
    <div id="prefooter-container"></div>
    <div id="footer-container"></div>

    <!-- Modales -->
    <div id="modals-container"></div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <script src="../js/loader.js"></script>
    <script src="../js/import-modals.js"></script>
    <script src="../js/chatbot.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
        const regreso = localStorage.getItem('ultimaPagina') || '/pages/index.html';
        document.getElementById('seguir-comprando').href = regreso;
        });
    </script>

</body>
</html>
