<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Carrito de Compras</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <!-- Encabezado -->
    <header class="bg-white shadow-sm sticky-top">
        <nav class="navbar navbar-expand-lg navbar-light">
            <div class="container">
              <!-- Logo + Nombre -->
              <a class="navbar-brand d-flex align-items-center" href="index.html">
                <img src="../assets/images/Rairock.png" alt="RaiRock Logo" height="30" class="me-2">
                <span class="fw-bold">RaiRock</span>
              </a>
              <!-- Menú Hamburguesa (mobile) -->
              <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain">
                <span class="navbar-toggler-icon"></span>
              </button>
              <!-- Menú Principal -->
              <div class="collapse navbar-collapse" id="navbarMain">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                  <li class="nav-item">
                    <a class="nav-link" href="index.html">
                      <i class="bi bi-house-door me-1"></i> Inicio
                    </a>
                  </li>
                  <li class="nav-item">
                    <a class="nav-link" href="#services">
                      <i class="bi bi-gear me-1"></i> Servicios
                    </a>
                  </li>
                  <li class="nav-item">
                    <a class="nav-link" href="#about">
                      <i class="bi bi-people me-1"></i> Sobre Nosotros
                    </a>
                  </li>
                  <li class="nav-item">
                    <a class="nav-link" href="#contact">
                      <i class="bi bi-envelope me-1"></i> Contacto
                    </a>
                  </li>
                </ul>
                <!-- Carrito + Login -->
                <div class="d-flex" id="user-actions">
                  <a href="cart.html" class="btn btn-outline-dark position-relative me-2">
                    <i class="bi bi-cart3"></i>
                    <span id="cartCounter" class="position-absolute top-0 start-100 translate-middle badge bg-danger rounded-pill">0</span>
                  </a>
                  <button class="btn btn-primary" id="loginBtn" aria-haspopup="dialog" aria-controls="loginModal">
                    <i class="bi bi-person-fill me-1"></i> Login
                  </button>
                </div>
              </div>
            </div>
          </nav>
    </header>

  <div class="container mt-5">
    <h1 class="mb-4">Carrito de Compras</h1>

    <div id="contenedor-carrito"></div>

    <div class="mt-3">
      <h4>Total: <span id="total-carrito">0</span> €</h4>
      <button id="vaciar-carrito" class="btn btn-danger mt-2">Vaciar Carrito</button>
    </div>
  </div>

    <!-- Modales de login y error importados dinámicamente -->
    <div id="modals-container"></div>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
      // Importa dinámicamente los modales desde partials/modals.html usando jQuery
      $(function() {
        $('#modals-container').load('../partials/modals.html');
      });
    </script>
    <script>
        // Añadir el año currentYear automáticamente
        document.getElementById('currentYear').textContent = new Date().getFullYear();
    </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/login-ui.js"></script>
    <!-- Eliminada lógica duplicada de apertura automática del modal de login, ahora centralizada en login-ui.js -->
</body>
</html>
