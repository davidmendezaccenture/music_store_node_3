<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Carrito de Compras</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!--Iconos bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

</head>
<body>
    <header class="bg-white shadow-sm sticky-top">
        <nav class="navbar navbar-expand-lg navbar-light">
            <div class="container">
                <!-- Logo + Nombre -->
                <a class="navbar-brand d-flex align-items-center" href="/pages/index.html">
                    <img src="../assets/images/Rairock.png" alt="RaiRock Logo" height="30" class="me-2">
                    <span class="fw-bold">RaiRock</span>
                </a>
                <a class="enlace-inicio btn btn-outline-secondary mb-5" href="/pages/index.html">  <img src="../assets/images/home.svg">Volver a inicio</a>
            </div>
        </nav>
    </header>
    <main>
        <div class="container mt-5">
            <h2 class="mb-4">Tu Carrito</h2>
            <ul class="container-fluid px-3" id="contenedor-carrito">
            </ul>
            <div class="container-fluid px-3 mt-3" id="total">
                <h4 class="text-end">Total: <span id="total-carrito"></span> €</h4>
                <div class="botones-carrito d-flex justify-content-between mt-4">
                    <a id="seguir-comprando" href="#" class="btn btn-outline-secondary mb-5">Seguir comprando</a>
                    <button id="confirmar-pago" class="btn btn-primary mb-5"><span class="icono">🛒</span>Confirmar pago</button>
                </div>
            </div>
        </div>
    </main>
    <!-- Footer -->
    <footer class="bg-dark text-white py-3 pie-de-pagina">
        <div class="container text-center ">
            <p class="mb-0">&copy; <span id="currentYear"></span> RaiRock Music Store. Todos los derechos reservados.</p>
        </div>
    </footer>

    <!-- Modal de inicio de sesión -->
    <div class="modal fade" id="modalCarrito" tabindex="-1" aria-labelledby="loginModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-body text-center">
                <img src="https://cdn-icons-png.flaticon.com/512/3064/3064197.png" alt="Login Icon" style="width:60px; margin-bottom:15px;">
                <p>¿Tienes cuenta?</p>
                <p>Inicia sesión para continuar.</p>
                <a href="/pages/login.html" class="btn btn-primary">Iniciar sesión</a>
                </div>
            </div>
        </div>
    </div>


<script>
    // Añadir el año actual automáticamente
    document.getElementById('currentYear').textContent = new Date().getFullYear();
</script>
    <script>
        //script para volver a la página guardada anterior. Si no hay, devuelve a home
        document.addEventListener('DOMContentLoaded', () => {
        const regreso = localStorage.getItem('ultimaPagina') || '/pages/index.html';
        document.getElementById('seguir-comprando').href = regreso;
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="../js/cart.js"></script>
    </body>
</html>
