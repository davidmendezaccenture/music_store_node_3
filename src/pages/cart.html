<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guitarras y Bajos - RaiRock Music Store</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <!-- Encabezado -->
    <header class="bg-white shadow-sm sticky-top">
        <nav class="navbar navbar-expand-lg navbar-light">
            <div class="container-fluid">
              <!-- Logo + Nombre -->
              <a class="navbar-brand d-flex align-items-center" href="/pages/index.html">
                <img src="../assets/images/Rairock.png" alt="RaiRock Logo" height="30" class="me-2">
                <span class="fw-bold">RaiRock</span>
              </a>
        
                <!-- Menú Hamburguesa (mobile) -->
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain">
                    <span class="navbar-toggler-icon"></span>
                </button>
        
              <!-- Menú Principal -->
              <div class="collapse navbar-collapse" id="navbarMain">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                  <li class="nav-item">
                    <a class="nav-link" href="/pages/index.html">
                      <i class="bi bi-house-door me-1"></i> Inicio
                    </a>
                  </li>
                  <li class="nav-item">
                    <a class="nav-link" href="#services">
                      <i class="bi bi-gear me-1"></i> Servicios
                    </a>
                  </li>
                  <li class="nav-item">
                    <a class="nav-link" href="/pages/sobre_nosotros.html">
                      <i class="bi bi-people me-1"></i> Sobre Nosotros
                    </a>
                  </li>
                  <li class="nav-item">
                    <a class="nav-link" href="/pages/contact.html">
                      <i class="bi bi-envelope me-1"></i> Contacto
                    </a>
                  </li>
                </ul>
                    <!--Barra de búsqueda-->
                    <form class="d-flex me-3 mb-3 mb-lg-0" action="/buscar" method="GET" role="search">
                        <div class="input-group">
                            <input type="text" class="form-control" name="q" placeholder="Buscar" required>
                            <select class="form-select" name="categoria">
                                <option value="">Todas</option>
                                <option value="guitarras">Guitarras</option>
                                <option value="teclados">Teclados</option>
                                <option value="percusion">Percusión</option>
                                <option value="viento">Viento</option>
                            </select>
                            <button class="btn btn-outline-primary" type="submit">
                                <i class="bi bi-search"></i>
                            </button>
                        </div>
                    </form>
                <!-- Carrito + Login -->
                    <div class="d-flex align-items-center ms-auto" id="user-actions">
                        <a href="/pages/cart.html" class="btn btn-outline-dark position-relative">
                            <i class="bi bi-cart3"></i>
                            <span id="cartCounter" class="position-absolute top-0 start-100 translate-middle badge bg-danger rounded-pill"></span>
                        </a>
                          <span class="fw-bold user-name mx-3 text-truncate" title="Nombre de usuario">Invitado</span>
                        <button class="btn btn-primary btnLogin" data-bs-toggle="modal" data-bs-target="#loginModal">
                            <i class="bi bi-person-fill me-1"></i> Login
                        </button>
                    </div>
              </div>
            </div>
        </nav>
    </header>
     <main class="container mt-4" role="main">
  <div class="container mt-5">
    <div class="mb-4 text-center">
      <h2 class="mb-3">Tu Carrito</h2>
      <div class="text-start">
        <a id="seguir-comprando" href="#" class="btn btn-primary fw-bold">
        <i class="bi bi-arrow-left-circle me-2" aria-hidden="true"></i> Seguir comprando
        </a>
      </div>
    </div>
    <ul class="container-fluid px-3" id="contenedor-carrito"></ul>
    <div class="container-fluid px-3 mt-3" id="total">
        <h4 class="text-end">Total: <span id="total-carrito"></span> €</h4>
        <div class="botones-carrito text-end mt-4">
          <button id="confirmar-pago" class="btn btn-primary mb-5" aria-label="Confirmar y proceder al pago"><span class="icono">🛒</span>Confirmar pago</button>
        </div>
      </div>
    </div>
  </main>
    <!-- Footer -->
    <footer class="bg-dark text-white py-3 pie-de-pagina">
        <div class="container text-center ">
            <p class="mb-0">&copy; <span id="currentYear"></span> RaiRock Music Store. Todos los derechos reservados.</p>
        </div>
    </footer>

    <!-- Modal de inicio de sesión -->
    <div class="modal fade" id="modalCarrito" tabindex="-1" aria-labelledby="loginModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-body text-center">
                <img src="https://cdn-icons-png.flaticon.com/512/3064/3064197.png" alt="Login Icon" style="width:60px; margin-bottom:15px;">
                <p>¿Tienes cuenta?</p>
                <p>Inicia sesión para continuar.</p>
                <a href="/pages/login.html" class="btn btn-primary">Iniciar sesión</a>
                </div>
            </div>
        </div>
    </div>


<script>
    // Añadir el año actual automáticamente
    document.getElementById('currentYear').textContent = new Date().getFullYear();
</script>
    <script>
        //script para volver a la página guardada anterior. Si no hay, devuelve a home
        document.addEventListener('DOMContentLoaded', () => {
        const regreso = localStorage.getItem('ultimaPagina') || '/pages/index.html';
        document.getElementById('seguir-comprando').href = regreso;
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
      <!-- Modales de login y error importados dinámicamente -->
    <div id="modals-container"></div>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
      <script>
      // Importa dinámicamente los modales desde partials/modals.html usando jQuery
      $(function() {
        $('#modals-container').load('../partials/modals.html');
      });
    </script>
    
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/auth.js"></script>  
  <script src="../js/app.js"></script>
  <script src="../js/login-ui.js"></script>
    <!-- Eliminada lógica duplicada de apertura automática del modal de login, ahora centralizada en login-ui.js -->
</body>
</html>
