<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Detalles y especificaciones del producto. Compra online con garantía y envío rápido.">
  <title>Detalle de Producto - Fuzzr Music Store</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/search.css">
</head>

<body>

    <!-- HEADER DINÁMICO -->
  <div id="header-container"></div>


<!-- Botón para activar el offcanvas -->
<button class="chatbot-like-button" type="button" data-bs-toggle="offcanvas" data-bs-target="#servicesOffcanvas">
    <div class="chatbot-button-content">
        <i class="bi bi-compass-fill"></i>
        <span>Conéctate</span>
    </div>
</button>

<!-- Offcanvas Menu -->
<div class="offcanvas offcanvas-start" tabindex="-1" id="servicesOffcanvas">
    <div class="offcanvas-header">
        <h5 class="offcanvas-title">Ponte en contacto</h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body">
        <ul class="nav flex-column">
            <li class="nav-item">
                <a class="nav-link active" href="contact.html">
                    <i class="bi bi-envelope me-2"></i> Contacto
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="newsletter.html">
                    <i class="bi bi-mailbox me-2"></i> Newsletter
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="media.html">
                    <i class="bi bi-camera-reels me-2"></i> Media
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="faq.html">
                    <i class="bi bi-question-circle me-2"></i> FAQ
                </a>
            </li>
        </ul>
    </div>
</div>


  <!-- Contenido principal -->
  <main class="container mt-4 mb-3 fade-slide-in" role="main">
    <!-- cards detalle de producto contenedor dinámico para la card -->
    <div id="product-detail-container"></div>
    <!-- Toast de producto añadido -->
    <div class="position-fixed bottom-0 end-0" style="z-index: 1050; padding: 1rem 3.5rem;">
      <div id="toastAdd" class="toast align-items-center text-white bg-primary border-0" role="alert" aria-live="assertive" aria-atomic="true" style="min-width: auto; max-width: 241px;">
        <div class="d-flex">
          <div class="toast-body">Instrumento añadido al carrito</div>
          <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Cerrar"></button>
        </div>
      </div>
    </div>
  </main>

   <!-- PREFOOTER DINÁMICO -->
  <div id="prefooter-container"></div>

  <!-- FOOTER DINÁMICO -->
  <div id="footer-container"></div>




  <!-- Modales de login y error importados dinámicamente -->
  <div id="modals-container"></div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  
  <script>
    // Importa dinámicamente los modales desde partials/modals.html usando jQuery
    $(function () {
      $('#modals-container').load('../partials/modals.html');
    });
  </script>

  <!-- Modal para imagen ampliada -->
  <div class="modal fade" id="modalZoomImg" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content bg-transparent border-0 shadow-none">
        <div class="modal-body p-0 text-center">
          <img id="imgZoomModal" src="" alt="Imagen ampliada" class="img-fluid rounded shadow mx-auto d-block"
            style="max-width:100%; max-height:80vh; object-fit:contain;">
        </div>
      </div>
    </div>
  </div>

  

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <div id="modals-container"></div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <script src="../js/loader.js"></script>
    <script src="../js/product-detail.js"></script>
    <script src="../js/import-modals.js"></script>
    <script src="../js/chatbot.js"></script>

</body>

</html>
