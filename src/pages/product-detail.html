<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalle de Producto - RaiRock Music Store</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../css/styles.css">
</head>

<body>

    <!-- HEADER DINÁMICO -->
  <div id="header-container"></div>

  <!-- Contenido principal -->
  <main class="container mt-4" role="main">
    <!-- cards detalle de producto contenedor dinámico para la card -->
    <div id="product-detail-container"></div>
    <!--Notificacion de producto añadido-->
    <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 1050">
      <div id="toastAdd" class="toast align-items-center text-white bg-primary border-0" role="alert" aria-live="assertive"
        aria-atomic="true">
        <div class="d-flex">
          <div class="toast-body">Instrumento añadido al carrito</div>
          <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"
            aria-label="Cerrar"></button>
        </div>
      </div>
    </div>
  </main>

   <!-- PREFOOTER DINÁMICO -->
  <div id="prefooter-container"></div>

  <!-- FOOTER DINÁMICO -->
  <div id="footer-container"></div>




  <!-- Modales de login y error importados dinámicamente -->
  <div id="modals-container"></div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  
  <script>
    // Importa dinámicamente los modales desde partials/modals.html usando jQuery
    $(function () {
      $('#modals-container').load('../partials/modals.html');
    });
  </script>

  <!-- Modal para imagen ampliada -->
  <div class="modal fade" id="modalZoomImg" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content bg-transparent border-0 shadow-none">
        <div class="modal-body p-0 text-center">
          <img id="imgZoomModal" src="" alt="Imagen ampliada" class="img-fluid rounded shadow mx-auto d-block"
            style="max-width:100%; max-height:80vh; object-fit:contain;">
        </div>
      </div>
    </div>
  </div>

  
  <script src="../js/loader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/login-ui.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/product-detail.js"></script>

</body>

</html>
